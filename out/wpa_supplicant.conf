ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=0
update_config=0
ap_scan=1

# Без жёстких proto/pairwise/group: пусть supplicant согласует то, что отдаёт
# точка. С proto=RSN + group=CCMP он молча пропускал видимую сеть и оставался
# в SCANNING - точка, видимо, работает в смешанном режиме WPA/WPA2 с TKIP.
network={
	ssid="TP-LINK_Alf_5GHz"
	psk="<WIFI_PSK_TENDA>"
	key_mgmt=WPA-PSK
	scan_ssid=1
	priority=10
}
